return `<section class="card fam"><header><div><span class="code">${g[0]}</span><b>${g[1]}</b><small>${act.length} sur ${rows.length}</small></div><b class="n" data-out="fam:${g[0]}">${money(r.sums[g[0]])}</b></header>${off?'<p class="mut pad">Responsabilité civile non accordée pour cette activité.</p>':(act.length?'<div class="hd"><span>Garantie</span><span>Capital / base (DT)</span><span>Taux ‰ / fixe</span><span class="n">Prime (DT)</span></div>':'<p class="mut pad">Aucune garantie choisie.</p>')+show.map(x=>row(p,x,off,r)).join('')+(S.all||!rest?'':`<button class="g more" data-a="ex" data-id="${g[0]}">${ex[g[0]]?'Masquer les garanties non choisies':'+ '+rest+' autre'+(rest>1?'s':'')+' garantie'+(rest>1?'s':'')}</button>`)}</section>`}
function edit(c,p){const r=calc(p),n=ALL.filter(x=>p.rows[x[0]].on).length,fl=(k,l)=>`<div><label>${l}</label><input type="number" min="0" step="any" data-f="${k}" value="${+p[k]||0}"></div>`;
return `<div class="card pinfo"><div class="w"><label>Nom de la proposition</label><input data-f="name" value="${esc(p.name)}"></div><div class="w"><label>Activité</label><input list="al" data-f="activity" value="${esc(p.activity)}" placeholder="Tapez pour chercher une activité"></div><div><label>Responsabilité civile</label><select data-f="rc">${[['unknown','À vérifier'],['yes','Avec RC'],['no','Sans RC']].map(o=>`<option value="${o[0]}"${p.rc==o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></div><div class="acts"><button data-a="pone">Imprimer</button><button data-a="dup">Dupliquer</button><button class="d" data-a="delp">Supprimer</button></div></div>
<div class="edit"><div><div class="bar"><div class="seg"><button class="${S.all?'':'on'}" data-a="all0">Garanties choisies</button><button class="${S.all?'on':''}" data-a="all1">Toutes les garanties</button></div><span class="mut">${n} garantie${n>1?'s':''} choisie${n>1?'s':''} sur ${ALL.length}</span></div>${G.map(g=>fam(p,g,r)).join('')}</div>
<aside class="card sum"><div class="mut">Prime totale</div><div class="tot"><span data-out="total">${money(r.total)}</span> DT</div><dl>${G.filter(g=>g[2].some(x=>p.rows[x[0]].on)).map(g=>`<div><dt>${g[1]}</dt><dd class="n" data-out="fam:${g[0]}">${money(r.sums[g[0]])}</dd></div>`).join('')}<div><dt><b>Prime nette annuelle</b></dt><dd class="n" data-out="net"><b>${money(r.net)}</b></dd></div></dl>
<details><summary>Frais et multiplicateur</summary><div>${fl('fees','Frais fixes (DT)')}${fl('mult','Multiplicateur (1,12 = +12 %)')}${fl('add','Ajout final (DT)')}<small class="mut">(prime nette + frais) × multiplicateur + ajout final</small></div></details></aside></div>`}
function main(){const c=cur();if(view=='cmp'?c.props.length<2:!prop())view=c.props[0].id;const p=prop();
$('main').innerHTML=`<div class="ch"><div class="cf"><input class="big" data-cf="name" value="${esc(c.name)}" placeholder="Nom du client"><input data-cf="phone" value="${esc(c.phone)}" placeholder="Téléphone"><input data-cf="note" value="${esc(c.note)}" placeholder="Adresse, contact, remarque…"></div><div class="acts"><button class="p" data-a="pall">Imprimer tout (${c.props.length})</button><button class="g d" data-a="delc">Supprimer le client</button></div></div>
<div class="tabs">${c.props.length>1?`<button class="tab${view=='cmp'?' on':''}" data-a="view" data-id="cmp">Comparatif</button>`:''}${c.props.map(q=>`<button class="tab${q.id===view?' on':''}" data-a="view" data-id="${q.id}"><span data-out="tn:${q.id}">${esc(q.name)}</span><small data-out="tt:${q.id}">${money(calc(q).total)} DT</small></button>`).join('')}<button class="tab g" data-a="addp">+ Proposition</button></div>${p?edit(c,p):`<div class="card" style="padding:14px">${cmpT(c,1)}</div>`}`}
function render(){side();main();save()}
const out=(k,v)=>document.querySelectorAll(`[data-out="${k}"]`).forEach(e=>e.textContent=v);
function upd(){const c=cur(),p=prop();if(p){const r=calc(p);out('total',money(r.total));out('net',money(r.net));for(const k in r.sums)out('fam:'+k,money(r.sums[k]));for(const k in r.det)out('row:'+k,money(r.det[k]))}c.props.forEach(q=>{out('tn:'+q.id,q.name||'Sans titre');out('tt:'+q.id,money(calc(q).total)+' DT')});save()}
function ppage(c,p){const r=calc(p);return `<section class="pp"><h1>Proposition Multirisques Dommages</h1><p class="meta"><b>${esc(c.name)}</b>${c.phone?' · '+esc(c.phone):''}<br>${esc(p.name)}${p.activity?' — '+esc(p.activity):''}<br>Établie le ${new Date().toLocaleDateString('fr-FR')}</p><table class="t"><thead><tr><th>Garantie</th><th class="n">Capital / base (DT)</th><th class="n">Taux ‰ / valeur fixe</th><th class="n">Prime (DT)</th></tr></thead><tbody>${G.map(g=>{const rs=g[2].filter(x=>p.rows[x[0]].on);return rs.length?`<tr class="fm"><td colspan="3">${g[0]} — ${g[1]}</td><td class="n">${money(r.sums[g[0]])}</td></tr>`+rs.map(x=>{const d=p.rows[x[0]];return `<tr><td>${x[0]} ${nm(x[1])}</td><td class="n">${d.capital?money(d.capital):'—'}</td><td class="n">${x[2]=='f'?money(d.fixed)+' DT':(+d.rate||0)+' ‰'}</td><td class="n">${money(r.det[x[0]])}</td></tr>`}).join(''):''}).join('')}</tbody></table><table class="t tt"><tr><td>Prime nette annuelle</td><td class="n">${money(r.net)}</td></tr><tr><td>Frais fixes</td><td class="n">${money(p.fees)}</td></tr><tr><td>Multiplicateur</td><td class="n">× ${(+p.mult||0).toLocaleString('fr-FR')}</td></tr><tr><td>Ajout final</td><td class="n">${money(p.add)}</td></tr><tr class="fm"><td>Prime totale (DT)</td><td class="n">${money(r.total)}</td></tr></table><p class="foot">Simulation indicative, sous réserve de validation avant émission.</p></section>`}
const pr=h=>{$('pa').innerHTML=h;window.print()};
function dl(s,n){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}
const fixrc=p=>{if(p.rc=='no')G[4][2].forEach(r=>p.rows[r[0]].on=false)};
const set=(t,p)=>{const d=t.dataset,v=t.type=='checkbox'?t.checked:t.type=='number'?Math.max(0,+t.value||0):t.value;d.c?p.rows[d.c][d.k]=v:p[d.f]=v};
const A={menu:()=>document.body.classList.toggle('menu'),
cli:id=>{S.cid=id;view=cur().props[0].id;document.body.classList.remove('menu');render()},
addc:()=>{const n=blank();S.clients.unshift(n);S.cid=n.id;view=n.props[0].id;$('q').value='';render();document.querySelector('[data-cf=name]').select()},
view:id=>{view=id;render()},addp:()=>{const q=fresh(cur().props.length+1);cur().props.push(q);view=q.id;render()},
dup:()=>{const c=cur(),q=JSON.parse(JSON.stringify(prop()));q.id=uid();q.name+=' (copie)';c.props.splice(c.props.findIndex(x=>x.id===view)+1,0,q);view=q.id;render()},
delp:()=>{const c=cur();if(c.props.length<2)return alert('Un client doit garder au moins une proposition.');if(confirm('Supprimer cette proposition ?')){c.props=c.props.filter(x=>x.id!==view);render()}},
delc:()=>{if(confirm('Supprimer ce client et toutes ses propositions ?')){S.clients=S.clients.filter(x=>x.id!==S.cid);if(!S.clients.length)S.clients.push(blank());S.cid=S.clients[0].id;view=cur().props[0].id;render()}},
all0:()=>{S.all=false;render()},all1:()=>{S.all=true;render()},ex:id=>{ex[id]=!ex[id];render()},
pone:()=>pr(ppage(cur(),prop())),pid:id=>pr(ppage(cur(),cur().props.find(p=>p.id===id))),
pall:()=>{const c=cur();pr((c.props.length>1?`<section class="pp"><h1>Comparatif des propositions</h1><p class="meta"><b>${esc(c.name)}</b>${c.phone?' · '+esc(c.phone):''}<br>Établi le ${new Date().toLocaleDateString('fr-FR')}</p>${cmpT(c,0)}</section>`:'')+c.props.map(p=>ppage(c,p)).join(''))},
exp:()=>dl(JSON.stringify({version:2,clients:S.clients},null,2),'carte_clients_'+new Date().toISOString().slice(0,10)+'.json'),imp:()=>$('file').click()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b.dataset.id)});
document.addEventListener('focusin',e=>{if(e.target.type=='number')e.target.select()});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;if(t.id=='q')return side();if(d.cf){cur()[d.cf]=t.value;if(d.cf=='name')side();return save()}
if(!(d.f||d.c)||t.type=='checkbox'||t.tagName=='SELECT')return;set(t,prop());d.f=='activity'?save():upd()});
document.addEventListener('change',async e=>{const t=e.target,d=t.dataset;
if(t.id=='file'){const f=t.files[0];if(f)try{const cl=norm(JSON.parse(await f.text()));if(confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')){S.clients=cl;S.cid=cl[0].id;view=cl[0].props[0].id;render()}}catch{alert('Fichier JSON invalide.')}return t.value=''}
if(!(d.f||d.c))return;const p=prop();set(t,p);
if(d.f=='activity'){const v=p.activity.trim().toUpperCase(),rc=ACT.y.includes(v)?'yes':ACT.n.includes(v)?'no':null;if(rc&&rc!=p.rc){p.rc=rc;fixrc(p);render()}}
else if(d.f=='rc'){fixrc(p);render()}else if(t.type=='checkbox')render()});
$('al').innerHTML=[...ACT.y,...ACT.n].map(a=>`<option value="${esc(a)}">`).join('');
load();render();
if(location.protocol.startsWith('http')){
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
let ip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('inst').hidden=false});
A.inst=()=>{if(ip){ip.prompt();$('inst').hidden=true}};
if((/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform=='MacIntel'&&navigator.maxTouchPoints>1))&&!navigator.standalone)$('ios').hidden=false}
</script></body></html>
